format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    code-fold: true
    code-tools: false
    html-math-method: mathjax
    link-external-newwindow: true
    smooth-scroll: true
    standalone: false
    embed-resources: false
    reference-location: margin

execute:
  enabled: false
  freeze: auto
